<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061326"><title>Create your account | TRINETRA</title><style>
.member-nav-link{display:inline-flex!important;align-items:center;justify-content:center;padding:9px 15px!important;border:1px solid #e9b84f;border-radius:30px;color:#ffd77b!important;font-weight:800!important;margin-left:5px;white-space:nowrap}
.auth-page{min-height:100vh;background:radial-gradient(circle at 15% 10%,#193c5d 0,transparent 35%),radial-gradient(circle at 90% 90%,#33264b 0,transparent 35%),#061326;color:#eef5ff;font-family:Inter,Segoe UI,Arial,sans-serif;display:grid;place-items:center;padding:28px 16px}
.auth-card{width:min(100%,480px);padding:clamp(24px,5vw,42px);border:1px solid #294361;border-radius:24px;background:#0c1c31ed;box-shadow:0 24px 80px #0008;backdrop-filter:blur(16px)}
.auth-brand{display:flex;align-items:center;gap:12px;color:#ffe0a0;font-weight:900;letter-spacing:3px;margin-bottom:25px}.auth-brand img{width:48px;height:48px;object-fit:contain}.auth-card h1{font-size:clamp(28px,5vw,38px);margin:0 0 8px}.auth-muted{color:#9fb2cc;line-height:1.7;margin:0 0 24px}.auth-field{display:grid;gap:7px;margin:15px 0}.auth-field label{font-size:13px;color:#c6d5e9;font-weight:700}.auth-field input{width:100%;box-sizing:border-box;padding:13px 14px;border-radius:11px;border:1px solid #34506f;background:#071528;color:white;font:inherit;outline:none}.auth-field input:focus{border-color:#f2bd53;box-shadow:0 0 0 3px #f2bd5320}.auth-submit{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(110deg,#ffe6a2,#ffb52e);color:#211707;font-weight:900;font-size:15px;cursor:pointer;margin-top:10px}.auth-submit:disabled{opacity:.6;cursor:wait}.auth-links{color:#a9bad0;text-align:center;font-size:13px;margin-top:20px}.auth-links a,.auth-back{color:#ffd47a;text-decoration:none;font-weight:800}.notice{display:none;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.5;margin:12px 0}.notice.show{display:block}.notice.error{background:#542a3b;color:#ffdce5;border:1px solid #a84d67}.notice.success{background:#153c34;color:#b8f5dd;border:1px solid #28775e}.account-meta{display:grid;gap:12px;margin:25px 0}.account-meta div{padding:14px;border:1px solid #294361;border-radius:12px;background:#09182a}.account-meta small{display:block;color:#8fa6c3;margin-bottom:4px}.account-meta strong{overflow-wrap:anywhere}.auth-secondary{width:100%;padding:12px;border:1px solid #45617f;border-radius:11px;background:transparent;color:#edf5ff;font-weight:800;cursor:pointer}.auth-home{display:block;text-align:center;margin-top:20px;color:#a9bad0;text-decoration:none;font-size:13px}
</style></head><body class="auth-page"><main class="auth-card"><a class="auth-brand" href="index.html"><img src="assets/trinetra-logo.png" alt="Trinetra logo">TRINETRA</a><h1>Create your account</h1><p class="auth-muted">Join Trinetra to access your personal member area. Use your own email address and create a secure password.</p><div id="formNotice" class="notice" role="alert"></div><form id="signupForm"><div class="auth-field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" maxlength="80" required></div><div class="auth-field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" maxlength="190" required></div><div class="auth-field"><label for="password">Password (at least 10 characters)</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required></div><div class="auth-field"><label for="confirm_password">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="10" required></div><button class="auth-submit" type="submit">Create account</button></form><div class="auth-links">Already have an account? <a href="login.html">Sign in</a></div><a class="auth-home" href="index.html">← Back to Trinetra website</a></main><script src="assets/member-auth.js" defer></script></body></html>
